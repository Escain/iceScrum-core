/*
 * iceScrum-core — Apache Grails 7 build (migrated from Grails 2.5.6 BuildConfig.groovy)
 */
buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.grails.org/grails/restricted'
        }
    }
    dependencies { // Not published to Gradle Plugin Portal
        classpath "cloud.wondrify:asset-pipeline-gradle"
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-data-hibernate5"
        classpath "org.apache.grails:grails-gradle-plugins"
    }
}

plugins {
    id "idea"
    id "eclipse"
}

apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "cloud.wondrify.asset-pipeline"
apply plugin: "org.apache.grails.gradle.grails-plugin"

group = "org.icescrum"

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
}

dependencies {
    profile "org.apache.grails.profiles:web-plugin"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-events"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // Security (was spring-security-core 2.0.0 / spring-security-acl 2.0.1 Grails 2 plugins)
    implementation "org.grails.plugins:spring-security-core:7.0.0-M3"
    implementation "org.grails.plugins:spring-security-acl:7.0.0-M3"

    // Mail (was org.icescrum:mail fork of grails-mail)
    implementation "org.grails.plugins:mail:4.0.2"

    // Push (was atmosphere-meteor plugin + atmosphere-runtime 2.5.3)
    implementation("org.atmosphere:atmosphere-runtime:3.0.13") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }

    // Office documents (was poi 3.17)
    implementation "org.apache.poi:poi:5.4.1"
    implementation "org.apache.poi:poi-ooxml:5.4.1"

    // Textile rendering (was mylyn wikitext 2.8.0-SNAPSHOT from dead eclipse repo)
    implementation "org.eclipse.mylyn.docs:org.eclipse.mylyn.wikitext:3.0.48.202308291007"
    implementation "org.eclipse.mylyn.docs:org.eclipse.mylyn.wikitext.textile:3.0.48.202308291007"

    // Reports (was jasper Grails 2 plugin, JasperService vendored into this plugin)
    implementation "net.sf.jasperreports:jasperreports:6.21.4"
    implementation "com.lowagie:itext:2.1.7"

    // Feeds (was feeds 1.6 Grails 2 plugin)
    implementation "com.rometools:rome:2.1.0"

    // Was lib/loremipsum-1.0.jar
    implementation "de.sven-jacobs:loremipsum:1.0"

    runtimeOnly "cloud.wondrify:asset-pipeline-grails"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "com.zaxxer:HikariCP"

    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.spockframework:spock-core"
}

compileJava.options.release = 17

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

assets {
    packagePlugin = true
}
